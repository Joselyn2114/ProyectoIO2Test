# Modelo A: ResNet-18 entrenada desde cero para clasificación de anomalías.

_target_: src.models.resnet_scratch.ResNetScratchModule

# Número de clases (normal vs anomalía)
num_classes: 2

# Entrenada desde cero (como pide el enunciado)
pretrained: false

# Dimensión del embedding que se usará luego para Mahalanobis/TSNE/PCA
embedding_dim: 256

# 🔗 Conectar el learning rate desde config.optim
lr: ${optim.lr}

# (Opcional pero recomendado: también pasar weight_decay si tu módulo lo usa)
weight_decay: ${optim.weight_decay}
